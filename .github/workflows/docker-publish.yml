name: Build and publish

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  smoke-test:
    name: Smoke test (real grab)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Perl syntax check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcompress-zlib-perl libjson-perl libjson-xs-perl \
            libwww-perl liblwp-protocol-https-perl libhttp-cookies-perl libhtml-parser-perl
          perl -c zap2xml.pl

      - name: Shell lint
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck entry.sh healthcheck.sh

      - name: Build test image
        run: docker build -t zap2xml:test .

      - name: Run one grab against tvlistings.gracenote.com
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$PWD/data"
          docker run --rm --name zap2xml-test \
            -e LINEUP_ID=HEADEND1 -e ZIPCODE=00000 -e AFFILIATE_ID=orbebb \
            -e RUN_ONCE=true -e ENABLE_HTTP=false \
            -e "OPT_ARGS=-U -a -d 1" \
            -v "$PWD/data:/data" zap2xml:test 2>&1 | tee run.log

      - name: Verify XMLTV output
        run: |
          test -s data/xmltv.xml
          head -c 400 data/xmltv.xml
          grep -q "<tv " data/xmltv.xml
          grep -q "<channel id=" data/xmltv.xml
          grep -q "<programme " data/xmltv.xml
          CH=$(grep -c '<channel id=' data/xmltv.xml)
          P=$(grep -c '<programme ' data/xmltv.xml)
          echo "channels: $CH"
          echo "programmes: $P"
          [ "$CH" -ge 20 ]
          [ "$P" -ge 500 ]

      - name: Verify we stayed inside the request budget
        run: |
          REQS=$(grep -oE 'in [0-9]+ http request' run.log | grep -oE '[0-9]+' | tail -1)
          echo "http requests this grab: ${REQS:-unknown}"
          if [ -z "$REQS" ]; then echo "could not read request count"; exit 1; fi
          if [ "$REQS" -gt 150 ]; then
            echo "too many requests for a single grab ($REQS) - rate-limit regression"; exit 1
          fi
          if grep -qiE 'too many requests|rate limit' run.log; then
            echo "run log mentions rate limiting"; exit 1
          fi

  publish:
    name: Build and push to GHCR
    needs: smoke-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
