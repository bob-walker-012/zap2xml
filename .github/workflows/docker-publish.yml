name: Build and publish

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      live_api:
        description: "Hit the real Gracenote API (only works from IPs it has not blocked)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Perl syntax check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcompress-zlib-perl libjson-perl libjson-xs-perl \
            libwww-perl liblwp-protocol-https-perl libhttp-cookies-perl libhtml-parser-perl
          perl -c zap2xml.pl

      - name: Shell lint
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck entry.sh healthcheck.sh

      - name: Build test image
        run: docker build -t zap2xml:test .

      - name: Start fixture server (stand-in for tvlistings.gracenote.com)
        run: |
          python3 testdata/fixture_server.py 8000 > fixture.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/__count && break || sleep 0.5
          done

      - name: Run one grab against the fixture
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$PWD/data"
          docker run --rm --name zap2xml-test \
            --add-host host.docker.internal:host-gateway \
            -e ZAP2XML_BASE_URL=http://host.docker.internal:8000/ \
            -e LINEUP_ID=FIXTURE0 -e ZIPCODE=00000 -e AFFILIATE_ID=orbebb \
            -e RUN_ONCE=true -e ENABLE_HTTP=false \
            -e "OPT_ARGS=-U -a -d 1" \
            -v "$PWD/data:/data" zap2xml:test 2>&1 | tee run.log

      - name: Verify XMLTV output
        run: |
          test -s data/xmltv.xml
          head -c 400 data/xmltv.xml
          grep -q "<tv " data/xmltv.xml
          CH=$(grep -c '<channel id=' data/xmltv.xml)
          P=$(grep -c '<programme ' data/xmltv.xml)
          echo "channels: $CH"
          echo "programmes: $P"
          [ "$CH" -ge 4 ]
          [ "$P" -ge 20 ]

      - name: Verify the request budget
        run: |
          REQS=$(python3 -c "import json,urllib.request;print(json.load(urllib.request.urlopen('http://127.0.0.1:8000/__count'))['requests'])")
          echo "grid requests issued: $REQS"
          [ "$REQS" -le 12 ] || { echo "request budget blown ($REQS > 12)"; exit 1; }
          if grep -qiE 'too many requests|rate limit|403 Forbidden' run.log; then
            echo "run log shows throttling or blocking"; exit 1
          fi
          grep -q "http requests" run.log

      - name: Live API check (optional)
        if: ${{ inputs.live_api }}
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --name zap2xml-live \
            -e LINEUP_ID=HEADEND1 -e ZIPCODE=00000 \
            -e RUN_ONCE=true -e ENABLE_HTTP=false \
            -e "OPT_ARGS=-U -a -d 1" \
            -v "$PWD/data-live:/data" zap2xml:test 2>&1 | tee live.log
          grep -q "<programme " data-live/xmltv.xml
          echo "live programmes: $(grep -c '<programme ' data-live/xmltv.xml)"

  publish:
    name: Build and push to GHCR
    needs: smoke-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
